<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ax206Display - Security</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --panel: #1c1f26; --border: #2c313c; --text: #e6e8eb;
    --muted: #8b93a1; --accent: #5b9dfd; --accent-text: #0b1220; --danger: #f28b82; --success: #81c995;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header a { color: var(--muted); font-size: 0.85rem; text-decoration: none; }
  main { padding: 1.5rem; max-width: 420px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; }
  .card p.hint { color: var(--muted); font-size: 0.82rem; margin-top: 0; }
  .field { margin-bottom: 0.8rem; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
  .field input {
    width: 100%; background: #0f1116; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 0.5rem 0.6rem; font-size: 0.9rem;
  }
  button {
    background: var(--accent); color: var(--accent-text); border: none; border-radius: 6px;
    padding: 0.55rem 1.1rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%;
  }
  .status { font-size: 0.82rem; margin-top: 0.85rem; padding: 0.6rem 0.75rem; border-radius: 6px; display: none; }
  .status.show { display: block; }
  .status.success { background: rgba(129,201,149,0.12); color: var(--success); }
  .status.error { background: rgba(242,139,130,0.12); color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">Security</h1>
  <a href="/">&larr; Back to devices</a>
</header>
<main>
  <div class="card">
    <p class="hint" id="hint">Loading...</p>
    <form id="form">
      <div class="field"><label>Username</label><input type="text" id="username" autocomplete="username" required /></div>
      <div class="field"><label id="passwordLabel">Password</label><input type="password" id="password" autocomplete="new-password" minlength="8" required /></div>
      <button type="submit" id="submitButton">Set Password</button>
    </form>
    <div class="status" id="status"></div>
  </div>
</main>
<script>
  let configured = false;

  async function load() {
    const res = await fetch('/api/auth/status');
    const body = await res.json();
    configured = body.configured;
    document.getElementById('hint').textContent = configured
      ? `A password is set for "${body.username}". Changing it below takes effect immediately - you'll need the new password on your next request.`
      : 'No password is set yet - this dashboard is open to anyone who can reach it. Set one below to require a login.';
    document.getElementById('passwordLabel').textContent = configured ? 'New password' : 'Password';
    document.getElementById('submitButton').textContent = configured ? 'Change Password' : 'Set Password';
    if (configured) document.getElementById('username').value = body.username;
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('status');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    status.textContent = 'Saving...';
    status.className = 'status show';
    try {
      const res = await fetch(configured ? '/api/auth/credentials' : '/api/auth/setup', {
        method: configured ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) { status.textContent = body.detail || 'Failed.'; status.className = 'status show error'; return; }
      status.textContent = configured
        ? 'Password changed. Your browser will ask for it again on your next request.'
        : 'Password set. Reload this page (or navigate anywhere) and your browser will ask for it.';
      status.className = 'status show success';
      document.getElementById('password').value = '';
      await load();
    } catch (err) {
      status.textContent = `Failed: ${err}`;
      status.className = 'status show error';
    }
  });

  load();
</script>
</body>
</html>

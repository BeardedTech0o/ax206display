<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ax206Display - Monitoring</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2c313c;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b9dfd;
    --accent-text: #0b1220;
    --download: #5b9dfd;
    --upload: #81c995;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
  .actions { display: flex; gap: 0.5rem; align-items: center; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; display: grid; gap: 1rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 0.9rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
  .btn, button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 0.45rem 0.9rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }

  .tabs { display: flex; gap: 0.35rem; }
  .tab {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .stats-row { display: flex; gap: 1.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
  .stat { font-size: 0.8rem; color: var(--muted); }
  .stat .value { color: var(--text); font-size: 1.1rem; font-weight: 700; display: block; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; }

  .chart-wrap { width: 100%; height: 180px; }
  .chart-empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 3rem 0; }

  .bars { display: grid; gap: 0.75rem; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 0.6rem; }
  .bar-row .label { font-size: 0.8rem; color: var(--muted); }
  .bar-track { height: 8px; background: #0e1015; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.4s ease; }
  .bar-fill.warn { background: #f2b64e; }
  .bar-fill.danger { background: #f28b82; }
  .bar-row .pct { font-size: 0.8rem; text-align: right; color: var(--text); font-weight: 600; }

  .host-block { padding-top: 0.5rem; margin-top: 0.5rem; border-top: 1px solid var(--border); }
  .host-block:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
  .host-block h3 { font-size: 0.82rem; margin: 0 0 0.5rem; color: var(--muted); font-weight: 600; }

  .empty { color: var(--muted); padding: 1rem 0; text-align: center; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Monitoring</h1>
    <p>Throughput, system load, and configured integrations</p>
  </div>
  <div class="actions">
    <a class="btn ghost" href="/index.html">Devices</a>
    <a class="btn ghost" href="/integrations.html">Integrations</a>
  </div>
</header>
<main>
  <section class="card">
    <h2>
      <span>Throughput</span>
      <span class="tabs" id="rangeTabs">
        <button class="tab active" data-range="1h">1h</button>
        <button class="tab" data-range="24h">24h</button>
        <button class="tab" data-range="7d">7d</button>
      </span>
    </h2>
    <div class="stats-row">
      <div class="stat"><span class="value"><span class="dot" style="background:var(--download);"></span>Download</span><span id="dlNow">--</span> Mbps</div>
      <div class="stat"><span class="value"><span class="dot" style="background:var(--upload);"></span>Upload</span><span id="ulNow">--</span> Mbps</div>
      <div class="stat"><span class="value">Peak</span><span id="peakNow">--</span> Mbps</div>
    </div>
    <div class="chart-wrap" id="throughputChart"></div>
  </section>

  <section class="card">
    <h2>System</h2>
    <div class="bars" id="systemBars"></div>
  </section>

  <section class="card" id="proxmoxCard" style="display:none;">
    <h2>Proxmox</h2>
    <div id="proxmoxHosts"></div>
  </section>

  <section class="card" id="pbsCard" style="display:none;">
    <h2>Proxmox Backup Server</h2>
    <div id="pbsHosts"></div>
  </section>
</main>
<script>
let currentRange = "1h";

function fmt(n, digits) {
  if (n === null || n === undefined || Number.isNaN(n)) return "--";
  return n.toFixed(digits === undefined ? 1 : digits);
}

function barClass(pct) {
  if (pct === null || pct === undefined) return "";
  if (pct >= 90) return "danger";
  if (pct >= 75) return "warn";
  return "";
}

function renderBarRow(label, pct) {
  const width = pct === null || pct === undefined ? 0 : Math.max(0, Math.min(100, pct));
  const cls = barClass(pct);
  return `<div class="bar-row">
    <div class="label">${label}</div>
    <div class="bar-track"><div class="bar-fill ${cls}" style="width:${width}%;"></div></div>
    <div class="pct">${pct === null || pct === undefined ? "--" : fmt(pct, 0) + "%"}</div>
  </div>`;
}

// Hand-rolled SVG area+line chart - no charting library dependency, matches
// the rest of this UI's fully self-contained (no CDN, no internet needed on
// the LAN) design.
function renderChart(container, series) {
  const width = container.clientWidth || 600;
  const height = 180;
  const padding = { top: 10, right: 10, bottom: 18, left: 34 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const allPoints = series.flatMap(s => s.points);
  if (allPoints.length < 2) {
    container.innerHTML = '<div class="chart-empty">Not enough data yet</div>';
    return;
  }

  const minT = Math.min(...allPoints.map(p => p.t));
  const maxT = Math.max(...allPoints.map(p => p.t));
  const maxV = Math.max(1, ...allPoints.map(p => p.v));

  const x = t => padding.left + ((t - minT) / Math.max(1, maxT - minT)) * innerW;
  const y = v => padding.top + innerH - (v / maxV) * innerH;

  function pathFor(points) {
    return points.map((p, i) => `${i === 0 ? "M" : "L"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  }

  function areaFor(points) {
    const line = pathFor(points);
    const last = points[points.length - 1];
    const first = points[0];
    return `${line} L${x(last.t).toFixed(1)},${(padding.top + innerH).toFixed(1)} L${x(first.t).toFixed(1)},${(padding.top + innerH).toFixed(1)} Z`;
  }

  const gridLines = [0, 0.5, 1].map(f => {
    const gy = padding.top + innerH * (1 - f);
    const label = fmt(maxV * f, maxV * f < 10 ? 1 : 0);
    return `<line x1="${padding.left}" y1="${gy.toFixed(1)}" x2="${width - padding.right}" y2="${gy.toFixed(1)}" stroke="#2c313c" stroke-width="1" />
      <text x="${padding.left - 6}" y="${(gy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b93a1">${label}</text>`;
  }).join("");

  const layers = series.map(s => `
    <path d="${areaFor(s.points)}" fill="${s.color}" opacity="0.15" stroke="none" />
    <path d="${pathFor(s.points)}" fill="none" stroke="${s.color}" stroke-width="1.75" />
  `).join("");

  container.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none">
    ${gridLines}
    ${layers}
  </svg>`;
}

async function loadThroughput() {
  const [dlRes, ulRes] = await Promise.all([
    fetch(`/api/metrics/history?key=network.download.mbps&range=${currentRange}`),
    fetch(`/api/metrics/history?key=network.upload.mbps&range=${currentRange}`),
  ]);
  const dl = dlRes.ok ? await dlRes.json() : [];
  const ul = ulRes.ok ? await ulRes.json() : [];

  const dlPoints = dl.map(s => ({ t: s.t, v: s.v }));
  const ulPoints = ul.map(s => ({ t: s.t, v: s.v }));

  document.getElementById("dlNow").textContent = dlPoints.length ? fmt(dlPoints[dlPoints.length - 1].v) : "--";
  document.getElementById("ulNow").textContent = ulPoints.length ? fmt(ulPoints[ulPoints.length - 1].v) : "--";
  const allVals = [...dlPoints, ...ulPoints].map(p => p.v);
  document.getElementById("peakNow").textContent = allVals.length ? fmt(Math.max(...allVals)) : "--";

  renderChart(document.getElementById("throughputChart"), [
    { points: dlPoints, color: "#5b9dfd" },
    { points: ulPoints, color: "#81c995" },
  ].filter(s => s.points.length > 0));
}

async function loadDashboardSnapshot() {
  const res = await fetch("/api/metrics/dashboard");
  if (!res.ok) return;
  const data = await res.json();

  document.getElementById("systemBars").innerHTML = [
    renderBarRow("CPU", data.system.cpuPercent),
    renderBarRow("Memory", data.system.memoryPercent),
    renderBarRow("Storage", data.system.diskPercent),
  ].join("");

  const proxmoxCard = document.getElementById("proxmoxCard");
  const proxmoxHosts = document.getElementById("proxmoxHosts");
  if (data.proxmox && data.proxmox.length) {
    proxmoxCard.style.display = "";
    proxmoxHosts.innerHTML = data.proxmox.map(host => `
      <div class="host-block">
        <h3>${host.displayName || host.hostId}</h3>
        <div class="bars">
          ${host.nodes.length
            ? host.nodes.map(n => `
              ${renderBarRow(`${n.node} CPU`, n.cpuPercent)}
              ${renderBarRow(`${n.node} Mem`, n.memoryPercent)}
            `).join("")
            : '<div class="empty">No nodes reported yet</div>'}
        </div>
      </div>
    `).join("");
  } else {
    proxmoxCard.style.display = "none";
  }

  const pbsCard = document.getElementById("pbsCard");
  const pbsHosts = document.getElementById("pbsHosts");
  if (data.pbs && data.pbs.length) {
    pbsCard.style.display = "";
    pbsHosts.innerHTML = data.pbs.map(host => `
      <div class="host-block">
        <h3>${host.displayName || host.hostId}</h3>
        <div class="bars">
          ${host.datastores.length
            ? host.datastores.map(d => renderBarRow(d.store, d.usedPercent)).join("")
            : '<div class="empty">No datastores reported yet</div>'}
        </div>
      </div>
    `).join("");
  } else {
    pbsCard.style.display = "none";
  }
}

function wire() {
  document.getElementById("rangeTabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    currentRange = btn.dataset.range;
    document.querySelectorAll("#rangeTabs .tab").forEach(t => t.classList.toggle("active", t === btn));
    loadThroughput();
  });
}

function refreshAll() {
  loadThroughput();
  loadDashboardSnapshot();
}

wire();
refreshAll();
setInterval(refreshAll, 5000);
window.addEventListener("resize", () => loadThroughput());
</script>
</body>
</html>

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
    # These packages are pinned to the last release that targeted net8.0
    # (see Directory.Packages.props). The app is on net10.0 now, so the pins
    # can be lifted once the Windows app has been run against newer versions;
    # until then, don't let Dependabot open PRs that nobody can test in CI.
    ignore:
      - dependency-name: "SkiaSharp.Views.WPF"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "H.NotifyIcon.Wpf"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "LibreHardwareMonitorLib"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

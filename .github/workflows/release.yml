name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.0.0) - creates the tag if it doesn't already exist"
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  release-windows-exe:
    name: Publish signed Windows release
    runs-on: windows-latest
    # `if:` conditions can't reference the secrets context directly (see
    # ci.yml's identical comment on its own signing step) - routed through
    # job-level env: for the same reason.
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # The MSI Package/@Version needs a bare N.N.N number, not the tag's
          # leading "v" - tags are required to match "v*.*.*" (see the `on:`
          # trigger above), so this is always exactly the three-part version.
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Self-contained + single-file so the download just works: no separate
      # .NET Desktop Runtime install required on the user's machine.
      # IncludeNativeLibrariesForSelfExtract only bundles native assets that
      # are already part of the NuGet dependency graph's runtimes/ folders -
      # LibUsbDotNet's package ships no such asset (it's a pure P/Invoke
      # wrapper), so libusb-1.0.dll is NOT bundled here despite this flag.
      # It's fetched as a real sibling file by the next step instead.
      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/Ax206Display.App/Ax206Display.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish

      # LibUsbDotNet doesn't ship the native libusb-1.0.dll it P/Invokes into
      # (confirmed: its NuGet package has no runtimes/ folder at all) - every
      # released build has needed this DLL placed next to the exe by hand, or
      # the app fails at startup with a DllNotFoundException (see
      # App.xaml.cs's ReportFatalStartupError, which already has a hint for
      # exactly this). Fetching the official prebuilt binary here, pinned by
      # SHA256, means neither the zip nor the MSI needs the user to do that
      # themselves. VS2022/MS64 matches the app's own win-x64 publish target;
      # 7z is preinstalled on windows-latest runners.
      - name: Fetch libusb-1.0.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archiveUrl = "https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z"
          $expectedHash = "7FB1DFEC805B97983763D7D0AE244320DA12ADD1003D4249C96CC4D586398C79"
          $archivePath = Join-Path $env:RUNNER_TEMP "libusb-1.0.30.7z"

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "libusb-1.0.30.7z checksum mismatch: expected $expectedHash, got $actualHash"
          }

          7z e $archivePath "VS2022/MS64/dll/libusb-1.0.dll" "-opublish" -y
          if ($LASTEXITCODE -ne 0) {
            throw "7z extraction failed with exit code $LASTEXITCODE"
          }

      # No-op until WINDOWS_CODE_SIGNING_PFX_BASE64/_PASSWORD are configured
      # as repo secrets - see the identical step in ci.yml for the full story
      # (security audit finding F3 / AuthenticodeVerifier).
      - name: Sign Ax206Display.exe
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ax206display-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}"))
          try {
            & signtool.exe sign /f $pfxPath /p "${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}" `
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 publish/Ax206Display.exe
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      # Packages the (now-signed) exe into a proper per-machine MSI - Start
      # Menu shortcut, an Add/Remove Programs entry, and a clean upgrade/
      # uninstall on the next release via installer/Package.wxs's
      # MajorUpgrade, instead of a user hand-replacing the exe wherever they
      # happened to put it. No separate WiX install needed here: the
      # WixToolset.Sdk (pinned to 5.0.2 in the .wixproj, not a floating major
      # version - see https://wixtoolset.org/osmf/ for why v6+ isn't used)
      # is an ordinary NuGet-restored MSBuild SDK, so `dotnet build` below
      # fetches everything it needs on its own.
      - name: Build MSI installer
        run: dotnet build installer/Ax206Display.Installer.wixproj --configuration Release -p:ProductVersion=${{ steps.tag.outputs.version }}

      - name: Sign Ax206Display.msi
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "ax206display-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String("${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}"))
          try {
            $msiPath = (Get-ChildItem -Path installer/bin -Filter Ax206Display.msi -Recurse | Select-Object -First 1).FullName
            & signtool.exe sign /f $pfxPath /p "${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}" `
              /fd sha256 /tr http://timestamp.digicert.com /td sha256 $msiPath
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package and checksum the portable zip and installer
        id: asset
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"

          # The portable download is a zip (exe + libusb-1.0.dll), not a bare
          # exe: the exe alone can't find libusb-1.0.dll unless it's a
          # sibling file in the same folder, so a standalone exe download
          # would just be a different flavor of the crash this fetches to
          # avoid.
          $zipName = "Ax206Display-$tag-win-x64.zip"
          Compress-Archive -Path "publish/Ax206Display.exe", "publish/libusb-1.0.dll" -DestinationPath $zipName
          (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower() + "  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ascii
          "zipName=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $msiSource = (Get-ChildItem -Path installer/bin -Filter Ax206Display.msi -Recurse | Select-Object -First 1).FullName
          $msiName = "Ax206Display-$tag-win-x64.msi"
          Move-Item -Path $msiSource -Destination $msiName
          (Get-FileHash -Path $msiName -Algorithm SHA256).Hash.ToLower() + "  $msiName" | Out-File -FilePath "$msiName.sha256" -Encoding ascii
          "msiName=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" `
            "${{ steps.asset.outputs.msiName }}" `
            "${{ steps.asset.outputs.msiName }}.sha256" `
            "${{ steps.asset.outputs.zipName }}" `
            "${{ steps.asset.outputs.zipName }}.sha256" `
            --title "${{ steps.tag.outputs.tag }}" `
            --generate-notes
